<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Play Sound</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f0f0f0;
      }
      
      button:hover {
        background-color: #ff0000;
      }
      img{
        width: 200px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <button onclick="playSound()">
      <img src="adit.jpg" alt="" />
    </button>

    <audio id="sound" src="adit-tolongin-dit.mp3"></audio>

    <script>
      function playSound() {
        const audio = document.getElementById("sound");
        audio.play();
      }
    </script>
  </body>
</html>
